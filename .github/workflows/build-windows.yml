name: 打包 Windows 版 exe

on:
  # 手动触发：在 Actions 页面点 "Run workflow"
  workflow_dispatch:
  # 推送代码到 main 分支时自动触发
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 用 PyInstaller 打包
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "考勤处理工具" `
            --hidden-import xlrd `
            --hidden-import xlwt `
            --collect-submodules xlrd `
            --collect-submodules xlwt `
            app.py

      - name: 上传打包产物
        uses: actions/upload-artifact@v4
        with:
          name: 考勤处理工具-exe
          path: dist/*.exe
